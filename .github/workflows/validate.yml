name: Validate MSRP Operations Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          # apps.js is a legacy, unused ES-module implementation; the live bot
          # is CommonJS and does not load it. Validate active CommonJS files.
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './apps.js' -print0 | xargs -0 -n1 node --check
      - name: Validate slash command registration
        run: npm test
